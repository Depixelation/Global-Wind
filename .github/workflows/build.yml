name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          # Use 21 on older branches with Gradle wrappers that cannot run on Java 25.
          java-version: '25'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build using this branch's gradle.properties
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: globalwind-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
